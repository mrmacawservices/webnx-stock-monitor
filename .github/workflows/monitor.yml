name: WebNX Stock Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: webnx-stock-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python monitor.py
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}

      - name: Persist snapshot
        run: |
          git config user.name "webnx-stock-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add snapshot.json
          git diff --quiet --cached || git commit -m "Update snapshot [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase origin master && git push && exit 0
            echo "Push attempt $i failed, retrying..."
            sleep 5
          done
          exit 1
